app:
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:}

server:
  port: ${PORT:8080}

spring:
  application:
    name: beta

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:userDB}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${PGUSER:}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:}}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        ddl-auto: none